[project]
name = "sdpost-claw"
version = "0.1.0"
description = "Open-source full-scenario AI office agent desktop workstation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "sdpost-claw contributors" }
]
keywords = ["ai", "agent", "desktop", "workbench", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "aiohttp>=3.9",
    "aiofiles>=23.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "click>=8.0",
    "watchdog>=3.0",
    "croniter>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-benchmark>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
desktop = [
    "pywebview>=4.0",
]

[project.scripts]
sdpost = "sdpost_claw.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdpost_claw"]

# Bundle the skills directory inside the package so DesktopServer can
# discover it in wheel installs (not just source checkouts).
[tool.hatch.build.targets.wheel.force-include]
"src/skills" = "sdpost_claw/skills"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
